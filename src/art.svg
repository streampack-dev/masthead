<svg xmlns="http://www.w3.org/2000/svg" class="masthead-art" viewBox="0 0 1200 320" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="masthead-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="currentColor" stop-opacity="0"/>
      <stop offset="18%" stop-color="currentColor" stop-opacity="0.65"/>
      <stop offset="82%" stop-color="currentColor" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="currentColor" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="masthead-pulse" r="70%">
      <stop offset="0%" class="masthead-glow" stop-opacity="0.95"/>
      <stop offset="38%" class="masthead-glow" stop-opacity="0.42"/>
      <stop offset="100%" class="masthead-glow" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g class="masthead-circuit">
    <g class="masthead-circuit-traces">
      <path d="M60 248H216V172H394V126H598V84H856V126H1108"/>
      <path d="M128 84H332V152H518V210H698V178H902V214H1090"/>
      <path d="M184 274H308V226H468V266H682V214H874V250H1038"/>
      <path d="M92 154H246V110H430V154H650V118H842V152H1044"/>
      <path d="M758 62V252"/>
      <path d="M468 126V266"/>
      <path d="M902 126V250"/>
      <path d="M246 110V248"/>
      <path d="M1038 214V250"/>
    </g>
    <g class="masthead-circuit-nodes">
      <circle cx="216" cy="172" r="3.2"/><circle cx="394" cy="126" r="3.2"/><circle cx="598" cy="84" r="3.2"/>
      <circle cx="856" cy="126" r="3.2"/><circle cx="332" cy="152" r="3.2"/><circle cx="518" cy="210" r="3.2"/>
      <circle cx="698" cy="178" r="3.2"/><circle cx="902" cy="214" r="3.2"/><circle cx="308" cy="226" r="3.2"/>
      <circle cx="468" cy="266" r="3.2"/><circle cx="682" cy="214" r="3.2"/><circle cx="874" cy="250" r="3.2"/>
    </g>
