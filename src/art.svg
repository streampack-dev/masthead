      <g><circle r="7.2" fill="url(#masthead-pulse)"/><circle r="1.9" class="masthead-spark"/><animateMotion begin="2.5s" dur="18s" repeatCount="indefinite" path="M128,84 H332 V152 H518 V210 H698 V178 H902 V214 H1090"/></g>
      <g><circle r="6.8" fill="url(#masthead-pulse)"/><circle r="1.8" class="masthead-spark"/><animateMotion begin="5s" dur="16s" repeatCount="indefinite" path="M184,274 H308 V226 H468 V266 H682 V214 H874 V250 H1038"/></g>
      <g><circle r="6.5" fill="url(#masthead-pulse)"/><circle r="1.7" class="masthead-spark"/><animateMotion begin="7.5s" dur="20s" repeatCount="indefinite" path="M92,154 H246 V110 H430 V154 H650 V118 H842 V152 H1044"/></g>
